[project]
name = "goodreads-mcp"
version = "0.1.0"
description = "MCP server for statistical questions about the Goodreads BigQuery dataset"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "google-cloud-bigquery>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# The web console only. The MCP server's image never installs these, so the
# Anthropic SDK is absent from the service that holds BigQuery access.
web = ["anthropic>=1.0", "starlette>=0.37", "uvicorn>=0.30"]

[project.scripts]
goodreads-mcp = "goodreads_mcp.server:main"
goodreads-telemetry = "goodreads_mcp.telemetry_cli:main"
goodreads-chat = "webchat.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["goodreads_mcp*", "webchat*"]

[tool.setuptools.package-data]
webchat = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
