[project]
name = "goodreads-mcp"
version = "0.1.0"
description = "MCP server for statistical questions about the Goodreads BigQuery dataset"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=2.0",
    "google-cloud-bigquery>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# The web console only. The MCP server's image never installs these, so no
# model SDK is present in the service that holds BigQuery access.
#
# Both providers are installed together, and only the chosen one is imported --
# `provider.select()` imports inside the branch it picks. Installing one and
# not the other would work, but would turn a config mistake into an ImportError
# at the first turn instead of a startup log line.
web = [
    "anthropic>=1.0",
    "google-genai>=2.0",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.scripts]
goodreads-mcp = "goodreads_mcp.server:main"
goodreads-telemetry = "goodreads_mcp.telemetry_cli:main"
goodreads-chat = "webchat.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["goodreads_mcp*", "webchat*"]

[tool.setuptools.package-data]
# `static/*` does not match a subdirectory, so the self-hosted font would be
# absent from the wheel and the deployed console would silently fall back to a
# system monospace. Both patterns, explicitly.
webchat = ["static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
